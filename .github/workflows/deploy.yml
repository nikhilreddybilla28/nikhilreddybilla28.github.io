name: Deploy portfolio site

# Publishes the static site in site/ to the gh-pages branch, which GitHub Pages serves.
# There is no build step: site/ is copied as-is.
on:
  push:
    branches:
      - master
      - main
      - claude/portfolio-website-redesign-klfc0i
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f site/index.html
          test -f site/404.html
          test -f site/.nojekyll
          test -f site/assets/pdf/Nikhils_Resume.pdf

      - name: Deploy site/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          commit-message: "Deploy portfolio site from ${{ github.ref_name }}@${{ github.sha }}"
